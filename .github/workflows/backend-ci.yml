name: Backend CI
on:
  push:
    branches: [feat/supabase-backend-foundation, main]
    paths:
      - 'backend/erp-api/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/erp-api/**'
      - '.github/workflows/backend-ci.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/erp-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package
        run: mvn --batch-mode verify